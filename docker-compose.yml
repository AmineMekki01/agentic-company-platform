services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  celery-worker:
    build: ./backend
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "-l", "info", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: ./backend
    command: ["uv", "run", "celery", "-A", "app.celery_app", "beat", "-l", "info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      redis:
        condition: service_started

volumes:
  pg_data:
  qdrant_data:
  backend_venv:
  frontend_node_modules:
