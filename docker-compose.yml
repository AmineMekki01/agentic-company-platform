services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      LLM_API_CONCURRENCY: ${LLM_API_CONCURRENCY:-50}
      LLM_LOCAL_CONCURRENCY: ${LLM_LOCAL_CONCURRENCY:-4}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_LOCAL_TIMEOUT: ${LLM_LOCAL_TIMEOUT:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      CHECKPOINTER_POOL_SIZE: ${CHECKPOINTER_POOL_SIZE:-20}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-3}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-30/minute}
      RATE_LIMIT_ACTIONS: ${RATE_LIMIT_ACTIONS:-10/minute}
      RATE_LIMIT_STORAGE_URL: ${RATE_LIMIT_STORAGE_URL:-redis://redis:6379/1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  celery-worker:
    build: ./backend
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "-l", "info", "-c", "2"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: ./backend
    command: ["uv", "run", "celery", "-A", "app.celery_app", "beat", "-l", "info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production!}
      FERNET_KEY: ${FERNET_KEY:-}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      redis:
        condition: service_started

volumes:
  pg_data:
  qdrant_data:
  ollama_data:
  backend_venv:
  frontend_node_modules:
