[project]
name = "backend"
version = "0.1.0"
description = "Agentic Company Platform - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.13",
    "langchain-openai>=0.2.14",
    "langchain-core>=0.3.29",
    "psycopg[binary]>=3.2.3",
    "psycopg-pool>=3.2.4",
    "sse-starlette>=2.1.3",
    "qdrant-client>=1.12.0",
    "langchain-openai>=0.2.14",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "cohere>=5.13.0",
    "tika>=2.6.0",
    "celery[redis]>=5.4.0",
    "tavily-python>=0.5.0",
    "notion-client>=2.2.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "google-auth-httplib2>=0.2.0",
    "fastembed>=0.5.0",
    "ragas>=0.2.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
